# Keeps the GitHub Actions used by the workflows up to date (one grouped pull request a month).
# npm packages aren't included: a dependency update changes the build, so dist/ has to be rebuilt
# and committed with it, which is better done by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
