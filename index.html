<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <link rel="shortcut icon" href="#">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&#129430;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <script src="./dist/bundle.js" type="text/javascript"></script>

    <style rel="stylesheet" type="text/css">
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #2e7fa8;
            color: #2b3a4a;
            font-family: Nunito, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
        }

        #renderCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            touch-action: none;
            -ms-touch-action: none;
        }

        /* Loading / error screen: a cream toy card on the play-mat blue. */
        #statusOverlay {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.12), transparent 60%),
                repeating-conic-gradient(#2e7fa8 0% 25%, #2a76a0 0% 50%) 50% / 120px 120px;
            z-index: 20;
        }

        #statusOverlay[hidden] {
            display: none;
        }

        .status-card {
            width: min(100%, 400px);
            padding: 22px 24px 24px;
            border: 3px solid #344b63;
            border-radius: 20px;
            background: #f4ebdd;
            box-shadow: 0 6px 0 rgba(26, 40, 56, 0.45);
        }

        #statusOverlay[data-state="error"] .status-card {
            border-color: #c9667f;
        }

        .status-label {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #c9667f;
        }

        #statusTitle {
            margin: 0;
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 900;
            line-height: 1.1;
            color: #344b63;
        }

        #statusMessage {
            margin: 10px 0 0;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            color: #6b7b8c;
        }

        /* Little bouncing blocks while loading. */
        .status-blocks {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .status-blocks span {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            box-shadow: 0 3px 0 rgba(26, 40, 56, 0.35);
            animation: status-bounce 0.9s ease-in-out infinite;
        }

        .status-blocks span:nth-child(1) { background: #e8869f; }
        .status-blocks span:nth-child(2) { background: #d9a13b; animation-delay: 0.15s; }
        .status-blocks span:nth-child(3) { background: #3f8c84; animation-delay: 0.3s; }
        .status-blocks span:nth-child(4) { background: #456f99; animation-delay: 0.45s; }

        #statusOverlay[data-state="error"] .status-blocks {
            display: none;
        }

        @keyframes status-bounce {
            0%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .status-blocks span { animation: none; }
        }

        .status-actions {
            display: flex;
            margin-top: 18px;
        }

        .status-actions:has(> [hidden]:only-child) {
            display: none;
        }

        .status-button {
            appearance: none;
            border: 3px solid #344b63;
            border-radius: 999px;
            padding: 9px 18px;
            background: #e8869f;
            box-shadow: 0 3px 0 rgba(26, 40, 56, 0.45);
            color: #22313f;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.16s ease;
        }

        .status-button:hover {
            transform: translateY(-1px);
        }

        .status-button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 rgba(26, 40, 56, 0.45);
        }

        .status-button[hidden] {
            display: none;
        }

        #fps {
            position: absolute;
            background: #f4ebdd;
            border: 2px solid #344b63;
            border-radius: 999px;
            box-shadow: 0 3px 0 rgba(26, 40, 56, 0.45);
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            line-height: 26px;
            color: #344b63;
            top: 14px;
            right: 14px;
            min-width: 72px;
            height: 30px;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>
    <div id="statusOverlay">
        <section class="status-card" aria-live="polite">
            <p class="status-label">Interactive Portfolio</p>
            <h1 id="statusTitle">Loading scene</h1>
            <p id="statusMessage">Loading assets and interactive scene data.</p>
            <div class="status-blocks" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="status-actions">
                <button id="statusRetryButton" class="status-button" type="button" hidden>Retry loading</button>
            </div>
        </section>
    </div>
    <div id="fps">0</div>

    <script type="text/javascript">
        window.game = new window.game.Game();
    </script>
</body>

</html>
